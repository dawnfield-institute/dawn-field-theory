name: Validate Citations

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths:
      - 'citations/pending/*.yaml'

jobs:
  validate-citations:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Check for pending citations
      id: check-pending
      run: |
        # Count non-blacklisted YAML files
        count=$(find citations/pending/ -name "*.yaml" -not -name "example-*.yaml" -not -name "README.md" | wc -l)
        if [ $count -gt 0 ]; then
          echo "has-pending=true" >> $GITHUB_OUTPUT
          echo "Found $count pending citation files:"
          find citations/pending/ -name "*.yaml" -not -name "example-*.yaml" -not -name "README.md"
        else
          echo "has-pending=false" >> $GITHUB_OUTPUT
          echo "No pending citation files found (excluding examples)"
        fi

    - name: Validate citation files
      if: steps.check-pending.outputs.has-pending == 'true'
      id: validate
      run: |
        echo "🔍 Validating citation files..."
        python tools/validate_citations.py > validation_output.txt 2>&1
        validation_exit_code=$?
        
        echo "validation-success=$([ $validation_exit_code -eq 0 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
        
        # Store validation output for comment
        echo "VALIDATION_OUTPUT<<EOF" >> $GITHUB_ENV
        cat validation_output.txt >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
        if [ $validation_exit_code -ne 0 ]; then
          echo "❌ Citation validation failed"
          cat validation_output.txt
          exit 1
        else
          echo "✅ Citation validation passed"
          cat validation_output.txt
        fi

    - name: Comment validation results
      if: steps.check-pending.outputs.has-pending == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const validationSuccess = '${{ steps.validate.outputs.validation-success }}' === 'true';
          const validationOutput = process.env.VALIDATION_OUTPUT;
          
          const icon = validationSuccess ? '✅' : '❌';
          const status = validationSuccess ? 'PASSED' : 'FAILED';
          
          const body = `## ${icon} Citation Validation ${status}
          
          ${validationSuccess ? 
            'Your citation files have been validated and are ready for processing upon merge!' : 
            'There are issues with your citation files that need to be addressed before merge.'}
          
          ### Validation Output:
          \`\`\`
          ${validationOutput}
          \`\`\`
          
          ${validationSuccess ? 
            '🎉 **Ready for merge!** Your citations will be automatically processed and integrated when this PR is merged.' : 
            '⚠️ **Action required:** Please fix the validation errors and push your changes to re-trigger validation.'}
          
          ---
          *This validation runs automatically on all PRs that modify citation files.*`;
          
          // Find existing validation comment
          const comments = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          
          const existingComment = comments.data.find(comment => 
            comment.user.login === 'github-actions[bot]' && 
            comment.body.includes('Citation Validation')
          );
          
          if (existingComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              comment_id: existingComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }

    - name: Set PR status
      if: steps.check-pending.outputs.has-pending == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const validationSuccess = '${{ steps.validate.outputs.validation-success }}' === 'true';
          
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.payload.pull_request.head.sha,
            state: validationSuccess ? 'success' : 'failure',
            target_url: `${context.payload.repository.html_url}/actions/runs/${context.runId}`,
            description: validationSuccess ? 'Citation validation passed' : 'Citation validation failed',
            context: 'citation-validation'
          });

    - name: Summary
      if: steps.check-pending.outputs.has-pending == 'true'
      run: |
        echo "📊 Citation Validation Summary:"
        if [ "${{ steps.validate.outputs.validation-success }}" == "true" ]; then
          echo "✅ All citation files are valid and ready for merge"
          echo "🎯 Citations will be automatically processed when PR is merged"
        else
          echo "❌ Citation validation failed - please fix errors before merge"
          echo "🔄 Push changes to re-trigger validation"
        fi
