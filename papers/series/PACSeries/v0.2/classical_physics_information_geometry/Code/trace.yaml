notes: |
  This is PACSeries Paper 5 — classical physics derived from information geometry.
  
  Core claim: SEC wave dynamics produce Maxwell's equations when projected from
  MED-bounded recursive structure. The curl operator, quantized charge, wave speed c,
  and D=3 spatial dimensions all emerge from PAC/SEC/MED constraints without being
  assumed.
  
  Gravity (§8) is explicitly marked as speculative and walled off from the
  electromagnetic results.
  
  Source experiments come from two directories:
