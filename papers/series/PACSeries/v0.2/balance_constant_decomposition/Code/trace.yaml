    description: "PAC→MED theorem: k-step PAC conservation forces depth ≤ 2"
    key_result: "All k ≥ 2 floor to ≤ 2; limit k→∞ = exactly 2.0; deviation ~10⁻¹⁶"
    paper_sections: [9.3]

  - local: experiments/exp_13_med_depth_criticality.py
    source: dawn-field-theory/foundational/experiments/milestone3/scripts/exp_11_med_depth_criticality.py
    repo: dawn-field-theory
    description: "MED depth d=3 as edge-of-chaos invariant for A/(A+ξ) = ln(φ)"
    key_result: "d_cross = 3.25 ± 0.17 (CV = 5.3%); fine-grained d = 3.12"
    paper_sections: [9.3]

  - local: experiments/exp_14_coupling_base_residuals.py
    source: dawn-field-theory/foundational/experiments/milestone3/scripts/exp_12_coupling_base_residuals.py
    repo: dawn-field-theory
    description: "Fibonacci–MED complementarity: golden base paradox"
    key_result: "fd=ln(φ)=0.481 > fd₀=0.313; Fibonacci coupling cannot reach MED depth alone"
    paper_sections: [9.3]

  # --- reality-engine addition (February 2026) ---

