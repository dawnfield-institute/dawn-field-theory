    source: dawn-field-theory/foundational/experiments/prime_growth_dynamics/scripts/exp_23_xi_derivation_contest.py
    repo: dawn-field-theory
    description: "Three candidate derivations of Ξ compared"
    key_result: "Within-level: −0.02826; cross-level: +0.08538; net = π/55"
    paper_sections: [4.1]

  - local: experiments/exp_02_xi_exact_derivation.py
    source: dawn-field-theory/foundational/experiments/prime_growth_dynamics/scripts/exp_25_xi_exact_derivation.py
    repo: dawn-field-theory
    description: "Exact continuous k = 10.0121 for Ξ = γ + ln(φ)"
    key_result: "Δk = 0.0121 ≈ γ/48 at 0.67% error; 48 = F₁₀ − (F₅ + F₃)"
    paper_sections: [4.2]

  - local: experiments/exp_03_gamma_as_surplus.py
    source: dawn-field-theory/foundational/experiments/prime_growth_dynamics/scripts/exp_29_gamma_as_surplus.py
    repo: dawn-field-theory
    description: "γ = 54.5% of Ξ (surplus); ln(φ) = 45.5% (structure)"
    key_result: "Surplus-to-structure ratio = 1.200; Rule 110 midpoint ≈ γ at 0.56%"
    paper_sections: [9.1]

  - local: experiments/exp_04_gamma_falsification.py
    source: dawn-field-theory/foundational/experiments/prime_growth_dynamics/scripts/exp_30_gamma_falsification.py
    repo: dawn-field-theory
    description: "Falsification attempt — can γ be replaced?"
    key_result: "γ consistent within 0.67% tolerance; Δk = γ/48 at 1.44% error"
    paper_sections: [9.2]

  - local: experiments/exp_05_universal_decomposition.py
    source: dawn-field-theory/foundational/experiments/prime_growth_dynamics/scripts/exp_31_universal_decomposition.py
    repo: dawn-field-theory
    description: "All three Ξ values decompose within 0.27% of γ + ln(φ)"
    key_result: "p = 0.00376 (n=100,000); max error 0.272%"
    paper_sections: [3.2]

  - local: experiments/exp_06_ca_xi_clustering.py
