    description: "All 256 ECAs measured; Class IV cluster at Ξ"
    key_result: "p < 10⁻⁷; Rules 110,124 at 0.00077 from Ξ; enrichment 42.67×"
    paper_sections: [5]

  - local: experiments/exp_07_sieve_pac_conservation.py
    source: dawn-field-theory/foundational/experiments/asymmetric_conservation/scripts/exp_14_sieve_as_local_sec.py
    repo: dawn-field-theory
    description: "PAC exact at all 126 sieve steps for N=500,000"
    key_result: "41,538 primes; PAC exact all steps; Mertens error 0.012%"
    paper_sections: [6.1]

  - local: experiments/exp_08_phase_decomposition.py
    source: dawn-field-theory/foundational/experiments/asymmetric_conservation/scripts/exp_16_possibility_pruning.py
    repo: dawn-field-theory
    description: "Three-phase sieve decomposition: MED, SEC, residual"
    key_result: "Phase I prunes 73.3%; Phase II SEC loss; Phase III buffer"
    paper_sections: [6.3]

  - local: experiments/exp_09_p3_reconciliation.py
    source: dawn-field-theory/foundational/experiments/asymmetric_conservation/scripts/exp_17_p3_reconciliation.py
    repo: dawn-field-theory
    description: "p=3 carries 82.1% of φ-clustering impact"
    key_result: "2/3 = F₃/F₄; p=3 is the dominant φ-carrier in prime sieve"
    paper_sections: [6.3]

  - local: experiments/exp_10_base_invariance.py
    source: dawn-field-theory/foundational/experiments/base_agnostic_pac/scripts/exp_11_entropy_analysis.py
    repo: dawn-field-theory
    description: "PAC identity holds to <10⁻¹⁴ across 11 numerical bases"
    key_result: "φ²−φ−1 = 0 exact in all bases; digit entropy varies 20–30%"
    paper_sections: [8]

  - local: experiments/exp_11_zeckendorf_validation.py
    source: dawn-field-theory/foundational/experiments/base_agnostic_pac/scripts/exp_12_zeckendorf_validation.py
    repo: dawn-field-theory
    description: "Zeckendorf representation — F₁₀=55 structural significance"
    key_result: "Every integer has unique non-consecutive Fibonacci decomposition"
    paper_sections: [8]

  # --- milestone3 additions (February 2026) ---

  - local: experiments/exp_12_pac_depth_bound.py
    source: dawn-field-theory/foundational/experiments/milestone3/scripts/exp_22_pac_depth_bound.py
