key_results:
- Five domains converge on Ξ ≈ 1.058 (p = 0.00028)
- Ξ = γ + ln(φ) = 0.5772 + 0.4812 = 1.0584
- Class IV cellular automata cluster at Ξ (p < 10⁻⁷, enrichment 42.67×)
- PAC exact at all 126 sieve steps for N = 500,000
- p = 3 carries 82.1% of φ-clustering impact (2/3 = F₃/F₄)
- PAC identity invariant across 11 bases (deviation < 10⁻¹⁴)
- Discrete approximation 1 + π/55 within 0.124% of γ + ln(φ)
- Discretisation gap Δk = γ/48 at 0.67% error
- PAC forces MED depth ≤ 2 (analytical, milestone3/exp_22)
- Only k=2 (Fibonacci) gives ln(φ) decay rate
- MED depth crossing at d ≈ 3.25 ± 0.17 (milestone3/exp_11)
- 'γ rank #1 but 1/√3 performs comparably; 21 combinations within 5% of Ξ'
falsifiable_predictions:
- A fifth domain produces Ξ > 1% from γ + ln(φ)
- Alternative decomposition Ξ = f(x,y) with stronger basis than γ+ln(φ)
- PAC relationship breaks in some non-decimal base
- Proof that Mertens-γ does not require PAC conservation
