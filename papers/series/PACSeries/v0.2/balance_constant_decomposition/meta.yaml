description: 'Shows that the balance constant Ξ governing recursive-conservation systems
  decomposes as γ + ln(φ) ≈ 1.0584, where γ is the Euler-Mascheroni constant and φ
  is the golden ratio. Five independent computational domains — Fibonacci arithmetic,
  cellular automata, the prime number sieve, Landauer erasure, and Möbius field dynamics
  — converge on this value with p < 0.0003. The decomposition reflects two distinct
  costs: discrete-to-continuous regularisation (γ) and recursive information unit
  (ln φ).

  '
