    key_result: "F₁₈₃ ≈ 1.28×10³⁸ matches (M_Planck/m_proton)² ≈ 1.69×10³⁸ to ~24%"
    paper_sections: [11]
    cross_validation: dawn-field-theory/papers/standalone/qbe_pac_unification/Code/experiments/validated/16_gravity_hierarchy.py

  - local: papers/series/PACSeries/v0.2/standard_model_fibonacci_arithmetic/Code/experiments/exp_10_zprime_prediction.py
