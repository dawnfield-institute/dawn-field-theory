notes: |
  This is PACSeries Paper 4 — Standard Model parameters from Fibonacci arithmetic.
  
  The paper demonstrates that all 19 free parameters of the Standard Model can be
  expressed as closed-form Fibonacci expressions. Key experiments are drawn from
  milestone1 (theory derivations), milestone2 (extensions), and
  pac_confluence_xi (comprehensive validation with uniqueness proofs).
  
  Cross-validation scripts are listed where available — these provide independent
  checks on the same results using different approaches or parameterizations.
  
  All scripts are self-contained (numpy/scipy/matplotlib only).
  Results are saved as JSON to ../Data/results/ when run.
