created: '2026-02-10'
description: Traces code and data files back to their original repository locations
source_repository: dawn-field-theory
paper: standard_model_fibonacci_arithmetic
paper_type: theory  # PACSeries Paper 4 — Standard Model from Fibonacci

experiments:
  - local: papers/series/PACSeries/v0.2/standard_model_fibonacci_arithmetic/Code/experiments/exp_01_gauge_closure.py
    source: dawn-field-theory/experiments/milestones/milestone1/scripts/exp_17_f7_gauge_closure.py
    repo: dawn-field-theory
    description: "F₇=13 as gauge closure — SM has 13 DOF: U(1)+SU(2)+SU(3)+Higgs = 1+3+8+1"
    key_result: "F₇ uniquely closes gauge budget; 13 is the only Fibonacci number matching SM DOF count"
    paper_sections: [3, 3.1, 3.2]

  - local: papers/series/PACSeries/v0.2/standard_model_fibonacci_arithmetic/Code/experiments/exp_02_su4_forbidden.py
    source: dawn-field-theory/experiments/milestones/milestone1/scripts/exp_19_su4_forbidden.py
    repo: dawn-field-theory
    description: "SU(4)+ forbidden by Fibonacci filter"
    key_result: "SU(4) requires 15 generators — no Fibonacci number; only SU(2)×SU(3) tile F₇=13"
    paper_sections: [3.3]

  - local: papers/series/PACSeries/v0.2/standard_model_fibonacci_arithmetic/Code/experiments/exp_03_alpha_formula.py
    source: dawn-field-theory/experiments/milestones/milestone1/scripts/exp_12_alpha_formula.py
    repo: dawn-field-theory
    description: "Fine structure constant α from Fibonacci arithmetic"
    key_result: "α⁻¹ = F₁₀·F₇·φ/F₃ × (1 − F₁₀/(4π·F₇²))⁻¹ = 137.03600 vs CODATA 137.03600 (5.7 ppm)"
    paper_sections: [4.1, 4.2]
    cross_validation: dawn-field-theory/papers/standalone/qbe_pac_unification/Code/experiments/validated/01_alpha_comprehensive.py

  - local: papers/series/PACSeries/v0.2/standard_model_fibonacci_arithmetic/Code/experiments/exp_04_weinberg_angle.py
    source: dawn-field-theory/experiments/milestones/milestone1/scripts/exp_18_weinberg_angle.py
    repo: dawn-field-theory
    description: "Weinberg angle sin²θ_W = F₄/F₇ = 3/13"
    key_result: "sin²θ_W = 0.23077 vs measured 0.23122 ± 0.00003 (0.19% deviation)"
    paper_sections: [4.3]

  - local: papers/series/PACSeries/v0.2/standard_model_fibonacci_arithmetic/Code/experiments/exp_05_koide_formula.py
    source: dawn-field-theory/experiments/milestones/milestone1/scripts/exp_20_koide_formula.py
    repo: dawn-field-theory
    description: "Koide formula Q = F₃/F₄ = 2/3"
    key_result: "Q_measured = 0.666658 vs 2/3 = 0.666667 → 0.5 ppm agreement"
    paper_sections: [5]

  - local: papers/series/PACSeries/v0.2/standard_model_fibonacci_arithmetic/Code/experiments/exp_06_mass_ratios.py
