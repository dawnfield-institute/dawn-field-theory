key_results:
- ξ emerges necessarily from multi-mode erasure (DPI consequence)
- ξ is topological, invariant under temperature (100K-5000K)
- A/(A+ξ) = ln(φ) at decay ratio φ (0.03-0.16% error)
- ξ/A = 1.086 vs predicted 1.078 (0.76% error)
- 'Cascade amplification: 53× over single event (p = 2.75e-35)'
- 'Time density: 69× difference dense/sparse (p = 3.25e-5)'
- ξ(SU(3)) > ξ(SU(2)) > ξ(U(1)) confirmed (p = 1.51e-11)
- ln(φ) derived from PAC recursion Ψ(k)=Ψ(k+1)+Ψ(k+2)
falsifiable_predictions:
- ξ(SU(3)) > ξ(SU(2)) > ξ(U(1))
- Different decay ratio produces closer match than φ
- Fewer cascade generations produce more total ξ
