notes: |
  This is PACSeries Paper 1 — the foundation for the entire series.
  All scripts are self-contained (no core/ dependencies).
  
  Scripts exp_01 through exp_08 save JSON output directly. Scripts exp_09
  through exp_14 print results to stdout; their JSON files were created by
  capturing and structuring the stdout output during the Feb 2026 packaging
  session. exp_15 and exp_16 were similarly captured. exp_19, exp_23, exp_25
  were added in the Feb 19, 2026 package update to cover §15.3 results.
  
  All 18 result JSON files are included in Data/results/.
  generate_figures.py reads from these JSON files to produce 6 publication
  figures — no hardcoded data.
  
  To reproduce: pip install -r requirements.txt && python reproduce.py
