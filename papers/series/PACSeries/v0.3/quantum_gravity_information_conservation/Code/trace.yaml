schema_version: '1.0'
created: '2026-07-06'
description: Traces code and data files back to their original repository locations
source_repository: dawn-field-theory
paper: quantum_gravity_information_conservation
paper_type: foundational  # PACSeries Paper 8 — Quantum Gravity from Information Conservation

# Reproducibility model: repo-relative. Scripts are verbatim copies of the source
# milestone11 experiments and import the shared DFT core in place; reproduce.py puts
# foundational/experiments/milestone11/core on PYTHONPATH (the rest of the chain is
# resolved by the core modules). See reproduce.py. The MVAE/Planck-scale material
# (Sections 4-5) draws conceptually on the minimum_actualization_resolution (MAR)
# experiments, but the paper cites no individual MAR script; those results enter
# through the shared constants (T_MVAE, L_MVAE) in quantum_gravity.py.
source_core:
  - foundational/experiments/milestone11/core/quantum_gravity.py
  - foundational/experiments/milestone10/core/foundations.py
  - foundational/experiments/milestone9/core/infodynamics.py
  - foundational/experiments/milestone8/core/bsm.py

experiments:
  - local: experiments/exp_01_response_time_hierarchy.py
    source: dawn-field-theory/foundational/experiments/milestone11/scripts/exp_01_response_time_hierarchy.py
    repo: dawn-field-theory
    data: Data/results/exp_01_response_time_hierarchy_20260429_171409.json
    description: "Force response-time hierarchy from cascade depth"
    key_result: "phi^-183 = 5.69e-39 vs measured alpha_grav(proton) = 5.91e-39, 0.04% log-space match; depth ordering Spearman rho=1.0 (4/4)"
    paper_sections: [3.3]

  - local: experiments/exp_02_planck_from_negotiation.py
    source: dawn-field-theory/foundational/experiments/milestone11/scripts/exp_02_planck_from_negotiation.py
    repo: dawn-field-theory
    data: Data/results/exp_02_planck_from_negotiation_20260429_133843.json
    description: "Four routes to the Planck scale (Landauer, Heisenberg, Schwarzschild, Negotiation)"
    key_result: "Landauer 1.44, Heisenberg 0.5, Schwarzschild 2.0, Negotiation 1.63; inner routes converge 1.13x, full span 4x (bracket, not convergence) (4/4)"
    paper_sections: [4, 4.2]

  - local: experiments/exp_03_discrete_cascade_time.py
    source: dawn-field-theory/foundational/experiments/milestone11/scripts/exp_03_discrete_cascade_time.py
    repo: dawn-field-theory
    data: Data/results/exp_03_discrete_cascade_time_20260429_123155.json
    description: "Discrete cascade time and minimum tick"
    key_result: "Minimum tick T_MVAE = 1/(2 ln2) = 0.7213 t_P; Loschmidt echo error 1.8e19 at n=100 (4/4)"
    paper_sections: [4]

  - local: experiments/exp_04_singularity_saturation.py
    source: dawn-field-theory/foundational/experiments/milestone11/scripts/exp_04_singularity_saturation.py
    repo: dawn-field-theory
