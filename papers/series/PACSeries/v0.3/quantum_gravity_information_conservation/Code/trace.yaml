    description: "Singularity resolution by cascade saturation"
    key_result: "Kretschmann finite everywhere; area-law slope = 2.000 (info ~ M^2, not M^3); profile-independent (4/4)"
    paper_sections: [5, 5.1, 5.2]

  - local: experiments/exp_05_hawking_from_pac.py
