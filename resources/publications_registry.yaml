citation_formats:
  bibtex: |
    @preprint{groom2025_{id},
      author = {Groom, Peter},
      title = {{title}},
      url = {{external_url}},
      year = {2025},
      note = {Draft preprint},
      repository = {https://github.com/dawnfield-institute/dawn-field-theory}
    }
  
  apa: |
    Groom, P. (2025). {title}. ResearchGate. {external_url}
  
  ieee: |
    P. Groom, "{title}," ResearchGate, 2025. [Online]. Available: {external_url}

