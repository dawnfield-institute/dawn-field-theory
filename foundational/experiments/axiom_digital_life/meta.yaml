schema_version: '2.0'
title: 'Axiom-Seeded Digital Life'
directory_name: axiom_digital_life
description: >
  Minimal prototype of DFT-axiom-seeded digital life. Instead of simulating physics
  (gravity, friction, Newtonian mechanics), the world is seeded with two DFT axioms —
  PAC (f(Parent)=Σf(Children)) and SEC (∂S/∂t=α∇I−β∇H) — and life emerges from
  those axioms. Creatures ("Infobionts") live in a 1D PAC/SEC information field.
  Their metabolism, movement, reproduction (⊗ branch), and death (⊕ collapse) are
  all derived from DFT operators, not physics. The balance operator Ξ≈1.057 from
  the cellular automata experiment sets the reproduction threshold.
