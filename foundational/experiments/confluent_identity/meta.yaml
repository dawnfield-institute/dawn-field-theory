schema_version: '2.0'
description: 'Confluent Identity -- Phases 1-29: tests identity emergence in PAC-conservative
  fluid via discrete Hodge theory. 128x128 periodic lattice (+ 256x256 scale test),
  38 experiments across 29 phases. Core results: coupling-contribution rho=0.42 (survives
  size deconfound), CI(f) = Pi_harm @ f is proper projection (5/5 properties), H^1
  propagates upward. Spectral bandwidth is strongest sensitivity predictor (partial
  rho=0.44). MI reveals nonlinear coupling (NMI exceeds rho^2 by 0.22) but ceiling
  is real physics. Frame-relative identity: Δ_entropy rho=-0.79 with coupling (p=0.02),
  depth-dependent, but n=8 underpowered. Coupling is scale-dependent but pooling helps
  (reverse Simpson''s). Falsified: Fiedler coherence, H^1-revision, PAC buffer, Hodge
  orthogonality, Fiedler-entropy, boundary mediation, mid-mode ratio.

  '
