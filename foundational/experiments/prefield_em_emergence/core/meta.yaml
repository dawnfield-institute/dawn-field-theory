schema_version: "2.0"
description: "Core implementation modules for pre-field EM emergence"
semantic_scope: "implementation"
proficiency_level: "research"

files:
  - "[__init__.py]": "Package initialization and exports"
  - "[constants.py]": "Dawn Field constants (φ, Ξ, power law coefficients)"
  - "[mobius_field.py]": "MobiusField class - pre-field on Möbius manifold"
  - "[sec_operator.py]": "SECOperator class - Symbolic Entropy Collapse evolution"
  - "[projector.py]": "EMProjector and MaxwellValidator - 3D projection and validation"

dependencies:
  - numpy

key_classes:
  MobiusField:
    purpose: "Represent pre-field state on Möbius manifold"
    key_methods:
      - "potential(): Get |ψ|²"
      - "phase(): Get arg(ψ)"
      - "pac_residual(): Compute PAC conservation metric"
  
  SECOperator:
    purpose: "Evolve pre-field via SEC dynamics"
    key_methods:
      - "step(field, dt): One evolution step"
      - "evolve(field, n_steps): Multiple steps with checkpoints"
  
  EMProjector:
    purpose: "Project to 3D and extract E, B fields"
    key_methods:
      - "project(field): Full projection and analysis"

key_constants:
  PHI: 1.618033988749895
  XI: 1.0571
  PI_FREQ: 0.0301
  POWER_LAW_SLOPE: -4.42
  POWER_LAW_INTERCEPT: 2.34
