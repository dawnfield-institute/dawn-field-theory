schema_version: "2.0"
description: "Output directory for experiment results"
semantic_scope: "data"
proficiency_level: "research"

files: []

notes: |
  Results are saved as JSON files with naming convention:
    exp_NN_YYYYMMDD_HHMMSS.json
  
  Each result file contains:
    - timestamp: When experiment was run
    - experiment: Experiment identifier
    - config: Configuration used
    - results: Key findings
