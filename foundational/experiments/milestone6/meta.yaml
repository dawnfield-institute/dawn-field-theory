description: >
  Milestone 6: Scoped Mediation -- The Propagation Mechanism of DFT.
  10 experiments across 4 blocks testing whether scoped mediation is the
  universal propagation mechanism. Core results: alpha_EM at 5.7 ppm from
  Fibonacci formula (#1 of 10,440 combinations, 300x better than next),
  phi^6 coupling ratio at 0.30%, Euler gap = 1/(240*pi) at 0.09%,
  PAC conservation to machine precision (3.47e-18), rank-1 convergence
  67/67 boundaries, non-compositionality 99.96%. KAN arithmetic transition:
  K fraction increases (rho=1.0), N decreases (rho=-1.0) across levels.
  Scope boundary attenuation base=0.42 in phi range (R^2=0.67). Dark sector
  prediction: alpha_73 = 2.48e-16, m ~ 6 keV, sigma/m << 1 cm^2/g.
  Weak force = actualization (sin^2 theta_W = 3/13, 0.19%). Xi = conditional
  attractor (CV<1). PAC xi/P decreases with depth (Spearman rho=-0.8).
  Neutrino common-scale model: sum < 0.12 eV, splitting ratio needs PMNS
  correction. Per-level geometric mean survival = 1/phi within 2.3%
  (parallel/serial aggregation, three-factor insight from MAR exp_07).
  35/40 tests verified (88%).
