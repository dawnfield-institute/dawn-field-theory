  Milestone 6: Scoped Mediation -- The Propagation Mechanism of DFT.
  10 experiments across 4 blocks testing whether scoped mediation is the
  universal propagation mechanism. Core results: alpha_EM at 5.7 ppm from
  Fibonacci formula, phi^6 coupling ratio at 0.30%, Euler gap = 1/(240*pi)
  at 0.09%, PAC conservation to machine precision (3.47e-18), rank-1
  convergence 67/67 boundaries, non-compositionality 99.96%. Dark sector
  prediction: alpha_73 = 2.48e-16, m ~ 6 keV, sigma/m << 1 cm^2/g.
  Weak force = actualization (sin^2 theta_W = 3/13, 0.19%). Xi = conditional
  attractor (CV<1). Fibonacci arithmetic 3/3. Neutrino common-scale model:
  sum < 0.12 eV, splitting ratio needs PMNS correction. 27/40 tests verified
  (68%). Local-vs-local and global-vs-global pass; local-vs-global fails by design.
