schema_version: 2.0
directory_name: results
description: 'Experimental results storage for Pre-Field Recursion framework. Contains timestamped JSON data files and visualization plots from actual experimental runs.'
semantic_scope:
  - experimental_results
  - data_storage
  - visualization
  - statistical_analysis
  - empirical_data
files:
  - pre_field_recursion_results_20250930_144231.json
  - pre_field_recursion_results_20250930_183326.json
  - pre_field_recursion_plots_20250930_144232.png
  - pre_field_recursion_plots_20250930_183326.png
data_structure:
  json_results:
    format: "Comprehensive experimental records with metadata and statistical analysis"
    contents:
      - experiment_configuration: "Topology parameters, tolerance settings, random seeds"
      - raw_experimental_data: "Individual experiment results with PAC validation and amplification measurements"
      - statistical_summary: "Aggregated analysis including success rates, means, distributions"
      - temporal_analysis: "Time-series data and trend analysis"
  visualization_plots:
    format: "Multi-panel statistical plots with data distributions and performance metrics"
    panels:
      - amplification_histogram: "Distribution of measured amplification factors"
      - pac_consistency_timeseries: "Conservation performance over experimental sequence"
      - xi_convergence_plot: "Universal constant measurements and stability"
      - summary_statistics: "Overall framework performance metrics"
data_integrity:
  source: "Generated exclusively from actual experimental runs - no static examples"
  timestamp_format: "YYYYMMDD_HHMMSS for precise experimental tracking"
  reproducibility: "Results tied to specific random seeds and configuration parameters"
  validation: "All data validated through calibration test suite"
research_value:
  empirical_evidence: "Authentic experimental data suitable for scientific analysis"
  statistical_rigor: "Comprehensive metrics with confidence intervals and error analysis"
  publication_quality: "Results ready for peer review and academic publication"
  reproducible_research: "Complete experimental provenance and configuration tracking"