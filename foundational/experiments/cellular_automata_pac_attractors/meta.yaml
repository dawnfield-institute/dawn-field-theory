conditional_attractor_hypothesis: |
  Ξ ≈ 1.057 emerges when a system is: (1) closed, (2) recursive, 
  (3) internally conserving, (4) computationally saturated.
  Rule 110 (Class IV) satisfies all 4 conditions → P/A = 1.0579.
  Random systems satisfy 0-1 conditions → 0/1000 near Ξ.
  Fisher exact test: p = 3.5 × 10⁻¹⁰.

key_results:
