description: >
  Milestone 13: Identity as Complement — Relativity as Complement-Transformation.
  A vertex's identity IS its complement: the structure of the graph without it.
  Different observers compute different complements of the same entity (definitional
  parallax), and the transformations between complement-views form the Weyl group —
  the discrete skeleton of the continuous Lie group. SEC complexification extends
  this skeleton to the full Lorentz group, deriving special relativity from
  graph-theoretic complement operations. 13 experiments in 5 blocks.
