schema_version: '2.0'
directory_name: arithmetic
description: 'Foundational arithmetic implementations and validations for Dawn Field
  Theory.


  This directory contains the complete experimental validation framework for

  Probabilistic Arithmetic Collapse (PAC) theory, including 7 comprehensive

  experiments demonstrating energy-distance equivalence, semantic amplification,

  context relativity, and irreversibility in both synthetic and real LLM embeddings.


  Updated Feb 2026 with milestone3 arithmetic directions: stoichiometric Fibonacci

  framework, PAC-Lazy formula mesh, SEC cost hierarchy, and honest falsifications.

  '
version: '3.0'
status: experimentally_validated
semantic_scope:
- arithmetic
- probabilistic_collapse
- euclidean_geometry
- semantic_embeddings
- distance_metrics
- energy_equivalence
- pac_theory
- stoichiometric_fibonacci
- pac_lazy_architecture
components:
  euclidean_distance_validation:
    description: Primary validated framework for PAC theory experimental validation
    status: complete
    version: '2.0'
    key_findings:
    - Energy-distance equivalence validated (E=mc² with model-specific c²)
    - Semantic amplification discovered in real LLMs (+330% vs -91% synthetic)
    - Context relativity shows near-invariance in real embeddings (0.99× vs 7.42×
      synthetic)
    - Irreversibility confirmed with 40% reconstruction error in real collapse
    experiments:
    - experiment_01_mc2:
        hypothesis: E=mc² equivalence
        result: c² ≈ 1.0 (synthetic), c² ≈ 416 (real llama3.2)
        significance: p < 0.001
    - experiment_02_semantic_distance:
        hypothesis: Distance axioms hold
        result: Validated across all metrics
        significance: p < 0.001
    - experiment_03_collapse:
        hypothesis: Irreversibility
        result: 0.0004% error (synthetic), 40% error (real)
        significance: p < 0.001
    - experiment_04_composition:
        hypothesis: Associativity and commutativity
        result: Validated within numerical precision
        significance: p < 0.001
    - experiment_05_hierarchy:
        hypothesis: Structure preservation
        result: Validated across hierarchical levels
        significance: p < 0.001
    - experiment_06_context:
        hypothesis: Context sensitivity
        result: 7.42× variation (synthetic), 0.99× (real)
        significance: p < 0.001
    - experiment_07_real_embeddings:
        hypothesis: Theory generalizes to real LLMs
        result: All axioms validated with llama3.2
        significance: p < 0.001
    core_modules:
    - pac_engine.py: PAC theory implementation with collapse operations
    - pac_hierarchy.py: Hierarchical semantic structure management
    - embedding_generator.py: Multiple embedding strategies (Random, Ollama)
    - distance_metrics.py: Euclidean and semantic distance calculations
    documentation:
    - PROPOSAL.md: Original theoretical proposal
    - RESULTS.md: Comprehensive experimental validation (all 7 experiments)
    - METHODS.md: Reproducibility guidelines and procedures
    - README.md: Project overview and quick start guide
    test_coverage: 85%
  pac_theory:
    description: Probabilistic Arithmetic Collapse theoretical framework
    status: validated
    axioms:
      distance_preservation:
        formula: d(A, B) ≈ E(collapse(A,B))/c²
        validation: R² > 0.99 (synthetic), R² = 0.98 (real)
      irreversibility:
        formula: collapse(collapse(A, B), inverse) ≠ (A, B)
        validation: Confirmed with 40% reconstruction error (real)
      composition:
        formula: collapse(collapse(A, B), C) = collapse(A, collapse(B, C))
        validation: Commutative and associative within numerical precision
      context_sensitivity:
        formula: E(A|context₁) ≠ E(A|context₂)
        validation: 7.42× variation (synthetic), 0.99× (real)
    energy_distance_relationship:
      equation: E = mc²
      parameters:
        E: semantic energy (embedding magnitude)
        m: semantic mass (density)
        c²: model-specific constant
      experimental_values:
        synthetic: c² ≈ 1.0
        llama3.2: c² ≈ 416
        gpt4: TBD
        claude3: TBD
        gemini: TBD
  hodge_mapping:
    description: Geometric foundations for continuous representations
    status: implemented
    integration_status: awaiting_pac_validation_integration
    note: 'Foundational geometric transformations implemented.

      Integration with validated PAC framework planned.

      '
  minimum_effective_distance:
    description: Bounds on semantic collapse operations
    status: theoretical
    formula: MED(A, B) = min{ d(A, B), d(collapse(A, B), θ) }
    integration_status: awaiting_experimental_validation
    planned_experiments:
    - Measure MED across semantic hierarchies
    - Compare MED to Euclidean distance predictions
    - Validate compression optimality claims
  pac_notes:
    description: Historical theoretical development and insights
    status: superseded
    note: 'Original theoretical notes retained for historical context.

      Current work uses validated framework in euclidean_distance_validation/.

      '
  pac_engine_standalone:
    description: Legacy PAC implementation
    status: deprecated
    note: 'Earlier implementation superseded by euclidean_distance_validation/core/.

      Retained for reference only.

      '
