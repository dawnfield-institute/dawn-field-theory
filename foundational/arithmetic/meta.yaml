theoretical_results:
  key_discoveries:
  - Model-specific c² values (energy-distance scaling)
  - Semantic amplification in real LLMs (opposite of geometric prediction)
  - Context-invariant real embeddings (unexpected stability)
  - Significant irreversibility in real collapse (40% information loss)
  implications:
  - Different LLMs have different "mass-energy" relationships
  - Real semantic spaces exhibit amplification, not binding
  - Context effects minimal in trained models
  - True semantic collapse is irreversible
  open_questions:
  - Why do real LLMs amplify while geometry predicts binding?
  - What determines model-specific c² values?
  - Can we derive amplification from training dynamics?
  - Do quantum-like properties emerge in collapse operations?
