usage_patterns:
  new_projects:
    recommendation: Use euclidean_distance_validation/core/ for validated PAC operations
    example: 'from euclidean_distance_validation.core.pac_engine import PACEngine

      from euclidean_distance_validation.core.embedding_generator import OllamaEmbedding


      embedder = OllamaEmbedding(model="llama3.2:latest", dimension=3072)

      engine = PACEngine(embedding_strategy=embedder)


      collapsed = engine.collapse(embedding1, embedding2)

      distance = engine.distance_to(embedding1, embedding2)

      '
  research:
    recommendation: See euclidean_distance_validation/RESULTS.md for experimental
      evidence
    documentation:
    - RESULTS.md: All 7 experiments with statistical analysis
    - METHODS.md: Reproducibility procedures
    - PROPOSAL.md: Original theoretical motivation
  reproduction:
    recommendation: Follow euclidean_distance_validation/METHODS.md for exact procedures
    requirements:
    - Python 3.11.9+
    - Dependencies in requirements.txt
    - Ollama (optional, for real embeddings)
