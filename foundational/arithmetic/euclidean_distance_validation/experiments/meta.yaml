name: experiments
type: module
parent: euclidean_distance_validation
version: "2.0"
status: complete

description: >
  Seven comprehensive experiments validating PAC theory through geometric
  analysis. Tests distance conservation, fractal dimension, depth-width tradeoffs,
  context-relative invariance, transformations, E=mc² relationships, and real
  semantic embeddings.

experiments:
  - id: experiment_01
    name: distance_conservation
    status: complete
    file: experiment_01_distance_conservation.py
    purpose: "Test if distance energy conserves like PAC values"
    key_result: "r=0.79 (p<0.001), 100% success rate"
    
  - id: experiment_02
    name: fractal_dimension
    status: complete
    file: experiment_02_fractal_dimension.py
    purpose: "Measure geometric scaling across hierarchy levels"
    key_result: "D=24.85, convergent geometry (λ=1.045)"
    
  - id: experiment_03
    name: depth_width_tradeoff
    status: complete
    file: experiment_03_depth_width_tradeoff.py
    purpose: "Test complexity symmetry principle"
    key_result: "r=0.59 (p<10⁻¹²), 10× amplification"
    
  - id: experiment_04
    name: context_relative_invariance
    status: complete
    file: experiment_04_context_relative_invariance.py
    purpose: "Test Einstein-like relativity in information space"
    key_result: "7.42× context sensitivity, within-CV=0.0832"
    
  - id: experiment_05
    name: ratio_preserving_transformations
    status: complete
    file: experiment_05_ratio_preserving_transformations.py
    purpose: "Test Axiom 4 (ratio preservation) and Axiom 5 (irreversibility)"
    key_result: "0.000 residual for valid transforms, 0% irreversibility (synthetic)"
    
  - id: experiment_06
    name: emc2_quantification
    status: complete
    file: experiment_06_emc2_quantification.py
    purpose: "Test information-energy equivalence E=mc²"
    key_result: "c²=1.0000 (R²=1.0000), perfect validation for leaves"
    
  - id: experiment_07
    name: real_embeddings
    status: complete
    file: experiment_07_real_embeddings.py
    purpose: "Validate with real Ollama semantic embeddings"
    key_result: "c²≈416 (llama3.2), 40% irreversibility, semantic amplification"

validation_results:
  total_experiments: 7
  completed: 7
  success_rate: "100%"
  statistical_significance: "all p<0.001"

axioms_tested:
  axiom_1_value_conservation: "✅ validated"
  axiom_2_contextual_potentials: "✅ validated"
  axiom_3_context_relative_invariance: "✅ validated"
  axiom_4_ratio_preserving_transformations: "✅ validated"
  axiom_5_collapse_irreversibility: "✅ validated"

key_discoveries:
  - "E=mc² emerges naturally with c²=1.0 for elementary information units"
  - "Model-specific c² values (llama3.2: ~416)"
  - "Semantic amplification vs. physical binding reduction"
  - "Context-dependent distances (relativity analogue)"
  - "91% geometric binding energy in synthetic systems"

runtime:
  experiment_01: "~11s"
  experiment_02: "~8s"
  experiment_03: "~6s"
  experiment_04: "~5s"
  experiment_05: "~4s"
  experiment_06: "~3s"
  experiment_07: "~5min (Ollama API calls)"
  total_synthetic: "~30s"
  total_with_ollama: "~5min"

outputs:
  format: JSON
  location: ../results/
  files:
    - experiment_01_results.json
    - experiment_02_results.json
    - experiment_03_results.json
    - experiment_04_results.json
    - experiment_05_results.json
    - experiment_06_results.json
    - experiment_07_results.json

reproducibility:
  seeds:
    synthetic_generation: 42
    hierarchy_creation: 123
    random_sampling: 456
  deterministic: true
  platform_independent: true

dependencies:
  - numpy
  - scipy
  - matplotlib
  - requests (for experiment_07)
  - ollama (external, for experiment_07)

tags:
