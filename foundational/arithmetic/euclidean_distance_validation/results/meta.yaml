name: results
type: data
parent: euclidean_distance_validation
version: '2.0'
status: complete
description: 'Experimental results from all 7 validation experiments. JSON format
  containing metrics, statistical analysis, and raw data.

  '
result_files:
- name: experiment_01_results.json
  experiment: distance_conservation
  key_metrics:
  - success_rate: 100%
  - pearson_r: 0.79
  - mean_residual: 0.0057
- name: experiment_02_results.json
  experiment: fractal_dimension
  key_metrics:
  - fractal_dimension: 24.85
  - scaling_factor: 1.045
  - r_squared: 0.73
- name: experiment_03_results.json
  experiment: depth_width_tradeoff
  key_metrics:
  - pearson_r: 0.59
  - p_value: <10⁻¹²
  - amplification: 10×
- name: experiment_04_results.json
  experiment: context_relative_invariance
  key_metrics:
  - within_context_cv: 0.0832
  - cross_context_cv: 0.6175
  - context_sensitivity: 7.42
- name: experiment_05_results.json
  experiment: ratio_preserving_transformations
  key_metrics:
  - ratio_residual: 0.0
  - irreversibility_index: 0.0
  - transformations_tested: 4
- name: experiment_06_results.json
  experiment: emc2_quantification
  key_metrics:
  - c_squared_leaf: 1.0
  - c_squared_parent: 0.0913
  - r_squared: 1.0
  - binding_energy: 91%
- name: experiment_07_results.json
  experiment: real_embeddings
  key_metrics:
  - model: llama3.2:latest
  - c_squared: ~416
  - irreversibility: ~0.40
  - amplification_ratio: 3.3
format:
  type: JSON
  encoding: UTF-8
  schema:
    experiment: string
    date: ISO8601
    results: object
    metrics: object
    metadata: object
data_types:
  numerical_metrics: float64
  counts: int64
  strings: UTF-8
  arrays: numpy_serialized_as_lists
size:
  total: ~50KB
  per_experiment: ~7KB
usage:
  load_example: "import json\nwith open('results/experiment_06_results.json') as f:\n\
    \    data = json.load(f)\n    print(f\"c²: {data['c_squared_leaf']}\")\n"
reproducibility:
  deterministic: true
  platform_independent: true
  version_tracked: true
tags:
- experimental_data
- validation_results
- statistical_metrics
- json_format
files:
- experiment_04_context_invariance.png
- experiment_05_ratio_transformations.png
- experiment_06_emc2_quantification.png
- experiment_07_results.json
child_directories: []
