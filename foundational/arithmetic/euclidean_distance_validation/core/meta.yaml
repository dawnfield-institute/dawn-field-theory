name: core
type: module
parent: euclidean_distance_validation
version: '2.0'
status: complete
description: 'Core data structures and embedding generation strategies for PAC validation.
  Provides PACNode, PACHierarchy, and multiple embedding strategies (synthetic, Ollama,
  pretrained models).

  '
components:
- name: pac_hierarchy.py
  description: PACNode and PACHierarchy classes with distance metrics
  tests: test_hierarchy.py
  test_status: 11/11 passing
- name: embedding_generator.py
  description: Multiple embedding strategies (SyntheticEmbedding, OllamaEmbedding,
    PretrainedEmbedding, SentenceEmbedding)
  features:
  - synthetic_pac_compliant_embeddings
  - ollama_api_integration
  - transformers_support
  - sentence_transformers_support
key_classes:
  PACNode:
    purpose: Represents single node in PAC hierarchy
    key_methods:
    - distance_to
    - distance_residual
    - pac_residual
    - add_child
    attributes:
    - id
    - value
    - embedding
    - children
    - depth
    - ownership_weights
  PACHierarchy:
    purpose: Manages entire PAC hierarchy structure
    key_methods:
    - from_dict
    - to_dict
    - get_all_parents
    - get_level
    - compute_global_pac_residual
    - compute_global_distance_residual
  EmbeddingStrategy:
    purpose: Abstract base for embedding generation
    implementations:
    - SyntheticEmbedding
    - OllamaEmbedding
    - PretrainedEmbedding
    - SentenceEmbedding
testing:
  total_tests: 11
  passing: 11
  coverage_areas:
  - node_creation
  - hierarchy_construction
  - distance_calculation
  - pac_residual_computation
  - ownership_weights_validation
  - dag_support
  - embedding_generation
dependencies:
- numpy
- scipy
- requests (for Ollama)
- transformers (optional)
- sentence-transformers (optional)
performance:
  node_operations: O(1)
  distance_computation: O(d) where d=embedding_dim
  hierarchy_traversal: O(n) where n=num_nodes
  embedding_generation_synthetic: O(n*d)
  embedding_generation_ollama: O(n*api_latency)
tags:
- data_structures
- embedding_generation
- distance_metrics
- pac_validation
files:
- embedding_generator.py
- pac_hierarchy.py
child_directories: []
