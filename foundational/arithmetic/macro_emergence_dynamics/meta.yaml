schema_version: 2.0
directory_name: macro_emergence_dynamics
description: >
  Revolutionary experimental framework testing whether gravity operates as a recursive 
  information operator through fluid dynamics. Tests the hypothesis that turbulence 
  emerges from overconstrained recursive collapse rather than purely mechanical instabilities.

semantic_scope:
  - recursive gravity
  - fluid dynamics
  - information theory
  - turbulence emergence
  - navier-stokes reinterpretation

main_framework: "master_recursive_gravity_experiment.py"
status: "active_development"
phase: "I_complete"
next_phase: "extended_validation"

files:
  primary:
    - name: "master_recursive_gravity_experiment.py"
      type: "main_framework"
      description: "Consolidated recursive gravity experiment - THE MAIN WORKING FILE"
    
    - name: "examples.py"
      type: "usage_examples"
      description: "Examples showing how to use the master experiment framework"
  
  documentation:
    - "README.md"
    - "RECURSIVE_GRAVITY_RESEARCH_SUMMARY.md"
    - "EXPERIMENTAL_ANALYSIS_REPORT.md"
    - "meta.yaml"

child_directories:
  results:
    description: "Simulation results, plots, and analysis files"
    contains: ["*.json", "*.png", "*.pdf", "*.md"]
    
  legacy_scripts:
    description: "Previous individual component implementations"
    contains: 
      - "recursive_gravity_experiment.py"
      - "enhanced_recursive_gravity_experiment.py"
      - "stabilized_recursive_gravity_experiment.py"
      - "parameter_optimization_framework.py"
      - "recursive_gravity_visualizer.py"
      - "run_master_experiment.py"
      - "README_old.md"
      
  computational_validation:
    description: "MED framework validation components"
    status: "inherited_from_previous_research"
    
  formal_papers:
    description: "Mathematical formulations and proofs"
    
  notes:
    description: "Research notes and drafts"

research_hypothesis: >
  "Gravity operates as a recursive information operator, and turbulence emerges from 
  overconstrained recursive collapse rather than purely mechanical fluid instabilities."

experimental_framework:
  configurations:
    flat:
      expected_regime: "laminar"
      description: "Minimal gravitational constraint"
    tilt:
      expected_regime: "transitional" 
      description: "Moderate gravitational influence"
    drain:
      expected_regime: "turbulent"
      description: "Maximum gravitational constraint"

key_parameters:
  optimal:
    alpha_recursive: 0.02      # Recursive coupling strength
    xi_threshold: 2.0          # Overconstraint threshold
    recursion_depth: 8         # Memory depth
    viscosity: 0.005           # Fluid viscosity
    dt: 0.0002                 # Time step

current_results:
  regime_prediction_accuracy: "66.7%"
  combined_score: "39.8%"
  framework_status: "stable"
  key_findings:
    - "Recursive patterns emerge consistently"
    - "Numerical stability achieved"
    - "Parameter optimization complete"
    - "Framework ready for validation"

usage:
  quick_start: "python master_recursive_gravity_experiment.py"
  examples: "python examples.py"
  parameter_modification: "Use update_parameters() method"

revolutionary_potential:
  - "Reframe Navier-Stokes in terms of information dynamics"
  - "Bridge quantum mechanics and general relativity through information theory"
  - "Explain dark energy as recursive information dynamics"
  - "Advance AI through recursive pattern recognition"

next_steps:
  immediate:
    - "Parameter fine-tuning around optimal values"
    - "Higher resolution studies (64x64, 128x128 grids)"
    - "Extended simulation times"
  
  medium_term:
    - "Physical validation experiments"
    - "Laboratory fluid dynamics collaboration"
    - "Publication preparation"
  
  long_term:
    - "Experimental realization"
    - "Industrial applications"
    - "Broader physics implications"

development_philosophy: >
  From now on, we modify the existing master_recursive_gravity_experiment.py file 
  rather than creating new versions. This maintains a single source of truth and 
  prevents code fragmentation.
