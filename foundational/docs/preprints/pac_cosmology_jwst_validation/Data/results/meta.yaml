schema_version: "2.0"
description: "JSON output files from experiment runs"
semantic_scope: "data"
proficiency_level: "research"
validation_type: "auto-generated"

files: []  # Auto-generated, see experiments for source

notes: |
  Result files are named: exp_NN_name_YYYYMMDD_HHMMSS.json
  Each contains:
    - experiment: Experiment ID
    - timestamp: ISO timestamp of run
    - hypothesis: What was being tested
    - test_N_*: Results from each test
    - success: Boolean overall result
    - conclusion: Human-readable summary
