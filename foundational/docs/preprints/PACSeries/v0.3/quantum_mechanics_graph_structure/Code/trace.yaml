schema_version: '1.0'
created: '2026-07-06'
description: Traces code and data files back to their original repository locations
source_repository: dawn-field-theory
paper: quantum_mechanics_graph_structure
paper_type: foundational  # PACSeries Paper 11 — Quantum Mechanics from Graph Structure

# Reproducibility model: repo-relative. Scripts are verbatim copies of the source
# milestone14 experiments and import the shared DFT core in place; reproduce.py puts
# foundational/experiments/milestone14/core on PYTHONPATH. See reproduce.py.
source_core:
  - foundational/experiments/milestone14/core/quantum_complement.py
  - foundational/experiments/milestone13/core/identity_complement.py
  - foundational/experiments/milestone12/core/connection_geometry.py
  - foundational/experiments/milestone11/core/quantum_gravity.py
  - foundational/experiments/milestone10/core/foundations.py

experiments:
  - local: experiments/exp_01_orbit_hilbert_space.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_01_orbit_hilbert_space.py
    repo: dawn-field-theory
    description: "Orbit Hilbert space L^2(V/Aut(G)) construction"
    key_result: "Orbit Gram matrix = identity for all ADE types (4/4); resolves M13 PSD degeneracy"
    paper_sections: [2, 2.1, 2.3]

  - local: experiments/exp_02_permutation_rep_decomposition.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_02_permutation_rep_decomposition.py
    repo: dawn-field-theory
    description: "Permutation representation decomposition of Aut(G)"
    key_result: "Number of orbits = multiplicity of trivial irrep (Burnside) (4/4)"
    paper_sections: [2.2]

  - local: experiments/exp_03_born_rule_from_orbit_measure.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_03_born_rule_from_orbit_measure.py
    repo: dawn-field-theory
    description: "Born rule from orbit measure"
    key_result: "P(O_i)=|O_i|/n exact for uniform state (3/4); T3 Fibonacci-weighted state needs PAC correction (pre-registered fail)"
    paper_sections: [3, 3.1, 3.2]

  - local: experiments/exp_04_measurement_as_gauge_fixing.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_04_measurement_as_gauge_fixing.py
    repo: dawn-field-theory
    description: "Measurement as gauge fixing (orbit projection)"
    key_result: "Real orbit projectors are idempotent and irreversibly discard phase = the SEC arrow (4/4)"
    paper_sections: [4]

  - local: experiments/exp_05_sec_complexification_interference.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_05_sec_complexification_interference.py
    repo: dawn-field-theory
    description: "SEC complexification enables interference"
    key_result: "Real projectors give no destructive interference; SEC complexification restores the full range (4/4)"
    paper_sections: [5, 7]

  - local: experiments/exp_06_graph_double_slit.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_06_graph_double_slit.py
    repo: dawn-field-theory
    description: "Graph double-slit interference"
    key_result: "Orbit interference is algebraic, not positional — no vertex-level fringes (1/4, structural failure documented)"
    paper_sections: [12.2]

  - local: experiments/exp_07_noncommuting_observables_d4.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_07_noncommuting_observables_d4.py
    repo: dawn-field-theory
    description: "Non-commuting observables on D_4"
    key_result: "D_4 (S_3) is the only ADE type <= rank 8 with non-abelian Aut; NC(D_4)=1.2247, 0 elsewhere (4/4)"
    paper_sections: [5, 5.1]

  - local: experiments/exp_08_robertson_uncertainty.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_08_robertson_uncertainty.py
    repo: dawn-field-theory
    description: "Robertson uncertainty bound from non-commuting orbit observables"
    key_result: "Robertson bound Delta_A*Delta_B > 0 only for D_4; zero for all abelian-Aut types (4/4)"
    paper_sections: [5, 5.1]

  - local: experiments/exp_09_entanglement_product_graphs.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_09_entanglement_product_graphs.py
    repo: dawn-field-theory
    description: "Entanglement from Cartesian product graphs"
    key_result: "Tensor product = Cartesian graph product; Bell state entropy ln2=0.6931, reduced purity 0.5 (4/4)"
    paper_sections: [6]

  - local: experiments/exp_10_cross_milestone_compatibility.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_10_cross_milestone_compatibility.py
    repo: dawn-field-theory
    description: "Cross-milestone compatibility check"
    key_result: "Zero contradictions with Milestones 1-13 (4/4)"
    paper_sections: [12]

  - local: experiments/exp_11_m14_synthesis.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_11_m14_synthesis.py
    repo: dawn-field-theory
    description: "Milestone 14 synthesis"
    key_result: "Full QM operational toolkit derived from ADE orbit structure; 40/44 M14 score (4/4)"
    paper_sections: [14, 15]

  - local: experiments/exp_p13_bell_violation_topology.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_p13_bell_violation_topology.py
    repo: dawn-field-theory
    description: "Bell violation from orbit topology (P13)"
    key_result: "CHSH S=2sqrt2=2.828 on D_4 x D_4 (to 4e-16); E_7,E_8 give S<2 — violation requires nontrivial Aut (6/6)"
    paper_sections: [7, 7.1, 7.2]

  - local: experiments/exp_p14_orbit_dynamics.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_p14_orbit_dynamics.py
    repo: dawn-field-theory
    description: "Orbit Laplacian dynamics (P14)"
    key_result: "Schrodinger equation from H=B^T L B; U(t) unitary, automorphism-equivariant, energy-conserving to 2e-15 (6/6)"
    paper_sections: [8]

  - local: experiments/exp_p15_path_integral_zeno.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_p15_path_integral_zeno.py
    repo: dawn-field-theory
    description: "Path integral and Zeno effect on orbit space (P15)"
    key_result: "Propagator = sum over n-hop graph paths; Zeno P_survive(N=1000)=0.997, anti-Zeno dip at N=2 (5/5)"
    paper_sections: [9, 10]

  - local: experiments/exp_p16_decoherence_orbit_env.py
    source: dawn-field-theory/foundational/experiments/milestone14/scripts/exp_p16_decoherence_orbit_env.py
    repo: dawn-field-theory
    description: "Decoherence from orbit-environment coupling (P16)"
    key_result: "Exact decoherence formula (to 1.7e-15); Fermi golden rule Gamma^2=lambda^2 Var(H_env) universal across 6 topologies; orbit basis = pointer basis (5/5)"
    paper_sections: [11]
