description: 'Presents candidate closed-form expressions for the three Feigenbaum
  constants of period-doubling universality — r∞ to 13 significant figures, δ to 8,
  and |α| to 6 — using only π, Fibonacci numbers, and small integers. Exhaustive search
  of 3.9 million parameter triples shows the formula parameters uniquely optimal at
  1 in 280 billion odds. The formulas embed in a Möbius perturbation series, converge
  as a self-closing fixed-point equation, and remain invariant across all quadratic-maximum
  maps.

  '
