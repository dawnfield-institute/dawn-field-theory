score_note: 'Block A instrumentation 6/9 (exp_01 passed 3/3, exp_02 passed 3/3, exp_03
  open). exp_01 STANDS - validated against exact known answers, unaffected by the
  2026-08-17 retraction. Blocks B-E unstarted. ARCHIVED rather than falsified: the
  thesis was never tested, only its motivation removed. The instruments are reusable
  and the question is revivable, but that would be a new founding, not a continuation.

  exp_02 (2026-08-27) closes the fourth retracted route and calibrates the connectivity
  instrument. AT L=256 structure.correlation_length reads 0.6296 AT THE EXACT p_c
  of 2D site percolation against its own documented white-noise floor of 0.6321, with
  a total dynamic range of 0.003 across p in [0.40, 0.80], converging ONTO the floor
  as resolution improves (0.6111 -> 0.6199 -> 0.6257 -> 0.6296 for L = 32 -> 256).
  Discrimination power D_A = 0.893 against the connectivity estimator D_B = 7.526.
  So a system sitting EXACTLY on its critical point reads at the white-noise floor,
  and the inference "xi at the floor means maximally sub-critical" - the fourth route
  into the retracted wall, and the only one the 2026-08-17 retraction never examined
  - never carried the information read out of it. This does NOT say the engine is
  critical; it removes a piece of evidence that said it was not, leaving Q1 open.
  A bearing, not a verdict.

  THE CONNECTIVITY INSTRUMENT WORKS AND ITS DOMAIN IS LOCATED. It finds p_c to 0.013
  unaided, discriminates at 7.5 sigma, recovers nu = 1.3400 against exact 4/3 (0.5%),
  and scales as L^1.057 with R2 = 1.000 at p_c. Domain of validity xi >~ 2 CELLS:
  below that it reports the small-cluster tail growing with L by extreme-value sampling
  rather than by divergence (xi 4.4 -> alpha 0.085; xi 2.9 -> 0.195; xi 1.9 -> 0.398;
  xi 1.0 -> 0.565). That is a DOMAIN, not a defect - the same statement as estimator
  A white-noise floor at the other end of the scale, and every lattice length estimator
  has one. Block B needs it at and below p_c where xi runs 6.8 -> 61 cells, an order
  of magnitude inside the validated range. Limitation: the sub-critical side never
  reaches xi < 3.7 cells, so the floor was exposed only above p_c and its symmetry
  is NOT established.

  RE-SCORED 0/3 -> 3/3 THE SAME DAY, and the reason is recorded because the first
  write-up was wrong in a way worth keeping. exp_02 was given a KILL SENTENCE, which
  an instrument calibration should never carry: MISSION.md and STANDARDS 2.7.5 scope
  kill sentences to a MILESTONE declaring the condition under which IT fails, a claim
  about nature (M15: if holonomy is dynamically inert it is mathematics not physics;
  M16: the tiling picture is not what produces web geometry). A TOOL gets a DOMAIN
  OF VALIDITY instead, and locating a boundary is what calibration IS - exp_01 scored
  3/3 while finding three instrument bugs. Two registration defects also recorded:
  the kill sentence contradicted itself ("as strongly as it does at p_c" was never
  met, alpha 1.057 vs 0.398, only its numeric proxy was), and |alpha| < 0.25 is an
  ABSOLUTE COORDINATE, which STANDARDS 2.7.2 forbids registering. Every measured number
  is unchanged and the outcomes journal stands as lineage. See journals/2026-08-27_exp02_reframe_domain_not_kill.md.

  P6 AND P7 REMAIN REFUTED, and P6 outweighs the score. There is NO shared M17 instrument
  bias: exp_01 exponents run ~10% LOW (gamma/nu 9.4%, tau 10.0% - corrected 2026-08-27
  from a write-up that said "high"), exp_02 nu is 0.5% HIGH, same sizes same system.
  Bias belongs to each ESTIMATOR, not to the size range, so BLOCK B MAY NOT APPLY
  A BLANKET CORRECTION - every DFT exponent must be calibrated against the specific
  estimator that produced it.

  INSTRUMENT FAULT #12, caught on the smoke run: the nu minimiser returned 2.60, the
  top of its own scan range. A minimiser on its boundary has not found a minimum.
  nu_at_scan_boundary is now recorded and T3 fails outright on a boundary hit. NEW
  INSTRUMENTS in core/criticality.py, all N-D: connectivity_length (second moment
  of pair-connectedness over FINITE clusters, spanning excluded with the excluded
  count RETURNED so the exclusion is asserted not trusted), scaling_exponent, collapse_residual.
  A REJECTED CONTROL is recorded with its reason: thresholded smoothed Gaussian noise
  is NOT a null, because a thresholded correlated field is itself a level-set percolation
  problem with its own transition.

  '
pillar: SEC
hypothesis: 'The structure-forming systems have a critical point, locatable by finite-size
  scaling - run at several system sizes L and the xi/L curves CROSS at the critical
  parameter value, with the cluster-size distribution going power-law there and exponential
  away from it - and that critical point sits at Xi, which already marks transitions
  in Lorenz, in primes and in cellular automata at p < 1e-5. If it does, the framework
  has predicted the LOCATION of a transition it was not fitted to.

  '
falsification: 'If xi/L shows no crossing at any system size across the accessible
  parameter range, and the cluster-size distribution is exponential throughout, the
  structure-forming systems are generically sub-critical and Xi-at-transitions does
  not extend to structure formation. Second, weaker failure: a crossing that exists
  but sits nowhere near Xi answers Q1 yes and Q2 no, separating "the framework has
  criticality" from "Xi locates it".

  '
