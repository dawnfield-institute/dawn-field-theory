    as relational property of unresolved children
hypothesis:
  primary: Partial recursive functions are topological knots in computation space
    - dependency cycles that haven't collapsed
  secondary: The Halting Problem is equivalent to asking 'will this knot untie?' from
    outside the recursive tree
  tertiary: MED bounds (depth ≤ 2, nodes ≤ 3) emerge from Landauer erasure cost on
    recursive calls
connections:
- PAC: Total recursion = full actualization, children resolved
- SEC: Collapse is observer-relative, knot resolution depends on reference frame
- MED: Thermodynamic limit on recursion depth before forced collapse
- Ackermann: Maximum knotting - escapes primitive recursion but not thermodynamics
