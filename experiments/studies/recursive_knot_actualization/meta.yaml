title: Recursive Knot Actualization
description: Formalizes the hypothesis that partial recursive functions are topological
  knots - self-referencing without resolution - and that 'partiality' is observer-relative,
  arising because children are still resolving. Explores Ackermann function as maximum
  knotting depth before thermodynamic collapse.
