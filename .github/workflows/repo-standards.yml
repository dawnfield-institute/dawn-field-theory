name: Repository standards

# Replaces the old update-meta-yamls workflow, which opened a pull request on every
# push and produced 13 duplicate open PRs against a single branch. Generated artifacts
# are now verified here and regenerated by the committer, so CI never writes to the repo.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      # STANDARDS.md sections 2 and 5. Errors fail the build; warnings are advisory.
      - name: Validate experiment structure
        run: python tools/validate_experiment_structure.py

      - name: Check experiment index is current
        run: python tools/generate_experiment_index.py --check

      - name: Check inventory is current
        run: python tools/generate_inventory.py --check

      - name: Check generated metadata and map are current
        run: |
          python tools/update_meta_yamls.py > /dev/null
          python tools/generate_path.py > /dev/null
          if ! git diff --quiet; then
            echo "::error::Generated files are stale. Run the regeneration commands below and commit the result."
            echo ""
            echo "  python tools/update_meta_yamls.py"
            echo "  python tools/generate_path.py"
            echo "  python tools/generate_experiment_index.py"
            echo "  python tools/generate_inventory.py"
            echo ""
            git diff --stat
            exit 1
          fi
          echo "Generated files are current."
