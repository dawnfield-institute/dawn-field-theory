version: '1.1'
description: >
  This file enumerates the core theoretical and experimental directories in Dawn Field Theory's epistemic core.
  It is a directory-level index only. Document-level curation (which specific papers/code to cite) is maintained in
  `cognition_index_protocol/gpt/gpt_resource_guide.yaml`.
  Only files with bracket-based filename metadata tags (see .cip/filename_lexicon.yaml) and relevant meta.yaml entries
  are considered canonical intellectual artifacts. General documentation (README, INTENTIONS, CONTRIBUTING, LICENSE, etc.)
  and meta/config files are excluded from this index.
core_directories:
  - foundational/docs/
  - foundational/experiments/
  - foundational/arithmetic/
  - models/
  - cognition_index_protocol/architecture/
  - cognition_index_protocol/gpt/
  - any future directories containing theoretical, experimental, or architectural work with bracket-based filename tags
notes:
  - This list references directories, not individual files.
  - Use `map.yaml` as the canonical source of truth for paths; do not infer relative paths from meta.yaml alone.
  - Only files matching the bracket-based filename metadata schema and listed in their directory's meta.yaml are
    considered for ingestion, reasoning, or validation.
  - Treat the GPT Resource Guide as the authoritative document-level curation layer; use this core.yaml only for
    directory scope/orientation.
references:
  resource_guide: cognition_index_protocol/gpt/gpt_resource_guide.yaml
  map: map.yaml
  instructions: .cip/instructions_v2.0.yaml
